services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fbm
      POSTGRES_PASSWORD: fbm_dev_password
      POSTGRES_DB: fbm
    ports:
      - "5432:5432"
    volumes:
      - fbm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fbm -d fbm"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  fbm_pgdata:
